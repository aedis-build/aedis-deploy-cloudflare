# OpenSSF Scorecard through the Aedis Platform reusable: weekly, on push to main and by hand; results published to
# the Scorecard API (public badge) and the SARIF to code scanning. This file only holds the trigger and permissions.
name: scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "29 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  scorecard:
    uses: aedis-build/aedis-platform/.github/workflows/scorecard.yml@255a90d04956caf7436320b50f104aaf80502e64 # v1.2.4
    permissions:
      contents: read
      security-events: write
      id-token: write
